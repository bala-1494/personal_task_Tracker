<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trakr — Habits &amp; Tasks</title>
  <style>
    /* ─────────────────────────────────────────────
       Reset & Variables
    ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0f1117;
      --surface:    #1a1d27;
      --surface2:   #22263a;
      --border:     #2e3250;
      --text:       #e8eaf6;
      --text-muted: #6b7280;
      --accent:     #6c63ff;
      --accent2:    #a78bfa;
      --red:        #ef4444;
      --amber:      #f59e0b;
      --green:      #22c55e;
      --red-soft:   rgba(239,68,68,0.15);
      --amber-soft: rgba(245,158,11,0.15);
      --green-soft: rgba(34,197,94,0.15);
      --accent-soft:rgba(108,99,255,0.15);
      --radius:     14px;
      --radius-sm:  8px;
      --transition: 0.2s ease;
    }

    html { font-size: 16px; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    .hidden { display: none !important; }

    /* ─────────────────────────────────────────────
       Loading overlay
    ───────────────────────────────────────────── */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
      transition: opacity 0.3s ease;
    }

    #loading-overlay.fade-out { opacity: 0; pointer-events: none; }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─────────────────────────────────────────────
       Error toast
    ───────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 5.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--red);
      color: #fff;
      padding: 0.6rem 1.1rem;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 400;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ─────────────────────────────────────────────
       WELCOME SCREEN
    ───────────────────────────────────────────── */
    #welcome-screen {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: radial-gradient(ellipse at 60% 30%, rgba(108,99,255,0.18) 0%, transparent 70%),
                  radial-gradient(ellipse at 20% 80%, rgba(167,139,250,0.12) 0%, transparent 60%),
                  var(--bg);
      text-align: center;
    }

    .welcome-logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 8px 32px rgba(108,99,255,0.4);
    }

    .welcome-title {
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }

    .welcome-tagline {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 3rem;
    }

    .welcome-form {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .welcome-form label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-align: left;
    }

    .welcome-input {
      width: 100%;
      padding: 0.9rem 1.1rem;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 1.05rem;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .welcome-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.2);
    }

    .welcome-input::placeholder { color: var(--text-muted); }

    .btn-primary {
      padding: 0.9rem 1.5rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity var(--transition), transform var(--transition);
      letter-spacing: 0.01em;
    }

    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    /* ─────────────────────────────────────────────
       MAIN APP SHELL
    ───────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
    }

    .app-header {
      padding: 1.25rem 1.25rem 0.5rem;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .greeting {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .tab-bar {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      margin: 0.75rem 0 0;
    }

    .tab-btn {
      flex: 1;
      padding: 0.75rem 0.5rem;
      background: none;
      border: none;
      border-bottom: 2.5px solid transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: color var(--transition), border-color var(--transition);
      letter-spacing: 0.01em;
    }

    .tab-btn.active {
      color: var(--accent2);
      border-bottom-color: var(--accent2);
    }

    .tab-panel {
      display: none;
      flex: 1;
      padding: 1.25rem;
      padding-bottom: 5rem;
      overflow-y: auto;
    }

    .tab-panel.active { display: block; }

    /* ─────────────────────────────────────────────
       DASHBOARD
    ───────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    .card-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .ring-container {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .ring-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .ring-svg { transform: rotate(-90deg); }

    .ring-bg {
      fill: none;
      stroke: var(--surface2);
      stroke-width: 8;
    }

    .ring-progress {
      fill: none;
      stroke: url(#ringGrad);
      stroke-width: 8;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.6s cubic-bezier(0.4,0,0.2,1);
    }

    .ring-text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .ring-count {
      font-size: 1.3rem;
      font-weight: 800;
      line-height: 1;
    }

    .ring-pct {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .ring-info h3 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .ring-info p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .task-counters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }

    .counter-pill {
      background: var(--surface2);
      border-radius: var(--radius-sm);
      padding: 0.85rem 0.5rem;
      text-align: center;
      cursor: pointer;
      transition: background var(--transition), transform var(--transition);
      border: 1px solid var(--border);
    }

    .counter-pill:hover { background: var(--border); transform: translateY(-2px); }

    .counter-num {
      font-size: 1.6rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 0.3rem;
    }

    .counter-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .counter-pill.overdue  .counter-num { color: var(--red); }
    .counter-pill.today    .counter-num { color: var(--amber); }
    .counter-pill.upcoming .counter-num { color: var(--green); }

    .streak-banner {
      background: linear-gradient(135deg, rgba(245,158,11,0.15), rgba(239,68,68,0.1));
      border: 1px solid rgba(245,158,11,0.3);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .streak-fire { font-size: 1.75rem; line-height: 1; }
    .streak-text { font-size: 0.95rem; font-weight: 600; }
    .streak-text span { color: var(--amber); font-size: 1.1rem; font-weight: 800; }

    .empty-state {
      padding: 1.5rem 0;
      text-align: center;
    }

    .empty-state p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    .empty-link {
      color: var(--accent2);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ─────────────────────────────────────────────
       BEHAVIOURS TAB
    ───────────────────────────────────────────── */
    .tab-date {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
    }

    .behaviour-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .behaviour-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      transition: opacity var(--transition);
      position: relative;
    }

    .behaviour-item.completed { opacity: 0.6; }
    .behaviour-item.completed .b-name {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .b-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition), border-color var(--transition), transform 0.15s ease;
    }

    .b-checkbox.checked {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-color: transparent;
    }

    .b-checkbox.pop { animation: checkPop 0.3s ease; }

    @keyframes checkPop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.35); }
      100% { transform: scale(1); }
    }

    .b-checkbox svg {
      width: 12px;
      height: 12px;
      stroke: #fff;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .b-checkbox.checked svg { opacity: 1; }

    .b-info { flex: 1; min-width: 0; }

    .b-name {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.35rem;
      transition: color var(--transition);
    }

    .dots-row { display: flex; gap: 4px; align-items: center; }

    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot.filled    { background: var(--accent2); }
    .dot.missed    { background: var(--surface2); border: 1px solid var(--border); }
    .dot.na        { background: var(--surface2); opacity: 0.4; }
    .dot.today-dot { border: 1.5px solid var(--accent2); background: transparent; }

    .b-delete {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity var(--transition), color var(--transition);
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .behaviour-item:hover .b-delete { opacity: 1; }
    .b-delete:hover { color: var(--red); }

    /* ─────────────────────────────────────────────
       TASKS TAB
    ───────────────────────────────────────────── */
    .tasks-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.1rem;
    }

    .show-completed-toggle {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 600;
      padding: 0.3rem 0.6rem;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: background var(--transition);
    }

    .show-completed-toggle:hover { background: var(--surface2); }

    .toggle-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background var(--transition);
    }

    .show-completed-toggle.active .toggle-dot { background: var(--green); }

    .section-header {
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 0.4rem 0;
      margin-bottom: 0.5rem;
      margin-top: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .section-header.overdue-hdr  { color: var(--red); }
    .section-header.today-hdr    { color: var(--amber); }
    .section-header.upcoming-hdr { color: var(--green); }
    .section-header.done-hdr     { color: var(--text-muted); }

    .task-list { display: flex; flex-direction: column; gap: 0.55rem; }

    .task-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.85rem 1rem;
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
      transition: opacity var(--transition);
    }

    .task-item.overdue-item  { border-left: 3px solid var(--red); }
    .task-item.today-item    { border-left: 3px solid var(--amber); }
    .task-item.upcoming-item { border-left: 3px solid var(--green); }
    .task-item.done-item     { opacity: 0.5; }
    .task-item.done-item .task-name { text-decoration: line-through; color: var(--text-muted); }

    .t-checkbox {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 2px solid var(--border);
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition), border-color var(--transition), transform 0.15s ease;
    }

    .t-checkbox.checked { background: var(--green); border-color: var(--green); }
    .t-checkbox.pop { animation: checkPop 0.3s ease; }

    .t-checkbox svg {
      width: 11px;
      height: 11px;
      stroke: #fff;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .t-checkbox.checked svg { opacity: 1; }

    .task-body { flex: 1; min-width: 0; }

    .task-name {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-meta { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }

    .priority-pill {
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.2rem 0.5rem;
      border-radius: 20px;
    }

    .priority-pill.high   { background: var(--red-soft);   color: var(--red); }
    .priority-pill.medium { background: var(--amber-soft);  color: var(--amber); }
    .priority-pill.low    { background: var(--green-soft);  color: var(--green); }

    .task-due { font-size: 0.72rem; color: var(--text-muted); font-weight: 500; }

    .t-delete {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity var(--transition), color var(--transition);
      flex-shrink: 0;
      margin-top: -2px;
    }

    .task-item:hover .t-delete { opacity: 1; }
    .t-delete:hover { color: var(--red); }

    /* ─────────────────────────────────────────────
       FAB
    ───────────────────────────────────────────── */
    .fab {
      position: fixed;
      bottom: 1.5rem;
      right: 50%;
      transform: translateX(50%);
      width: calc(min(480px, 100vw) - 2.5rem);
      max-width: 435px;
      padding: 0.85rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(108,99,255,0.45);
      transition: opacity var(--transition), transform var(--transition);
      z-index: 20;
      letter-spacing: 0.01em;
    }

    .fab:hover { opacity: 0.92; transform: translateX(50%) translateY(-2px); }

    /* ─────────────────────────────────────────────
       MODAL / BOTTOM SHEET
    ───────────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal-sheet {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 1.5rem 1.5rem calc(1.5rem + env(safe-area-inset-bottom));
      width: 100%;
      max-width: 480px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .modal-overlay.open .modal-sheet { transform: translateY(0); }

    .modal-drag {
      width: 36px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 1.25rem;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 1.25rem;
      letter-spacing: -0.01em;
    }

    .form-group { margin-bottom: 1rem; }

    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.4rem;
    }

    .form-input {
      width: 100%;
      padding: 0.75rem 0.9rem;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.18);
    }

    .form-input::placeholder { color: var(--text-muted); }

    .priority-selector { display: flex; gap: 0.5rem; }

    .priority-option {
      flex: 1;
      padding: 0.55rem;
      text-align: center;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: all var(--transition);
      background: var(--surface2);
      color: var(--text-muted);
    }

    .priority-option.selected-high   { background: var(--red-soft);   color: var(--red);   border-color: var(--red); }
    .priority-option.selected-medium { background: var(--amber-soft);  color: var(--amber); border-color: var(--amber); }
    .priority-option.selected-low    { background: var(--green-soft);  color: var(--green); border-color: var(--green); }

    /* ─────────────────────────────────────────────
       Scrollbar
    ───────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>

<!-- Loading overlay -->
<div id="loading-overlay">
  <div class="spinner"></div>
</div>

<!-- Error toast -->
<div id="toast"></div>

<!-- ══════════════════════════════════════════════
     WELCOME SCREEN
══════════════════════════════════════════════ -->
<div id="welcome-screen" class="hidden">
  <div class="welcome-logo">&#9997;&#65039;</div>
  <h1 class="welcome-title">Trakr</h1>
  <p class="welcome-tagline">Track your habits. Tame your tasks.</p>
  <form class="welcome-form" id="welcome-form" novalidate>
    <label for="username-input">What should we call you?</label>
    <input
      type="text"
      id="username-input"
      class="welcome-input"
      placeholder="Your name…"

<!-- SVG gradient definition for progress ring -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
</svg>

<script>
/* ═════════════════════════════════════════════
   DATE HELPERS
═════════════════════════════════════════════ */
const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};

const formatDate = (str) => {
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
};

const fullDateStr = () =>
  new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

const addDays = (str, n) => {
  const [y, m, d] = str.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + n);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
};

const escHtml = (str) =>
  str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
     .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

/* ═════════════════════════════════════════════
   API CLIENT
   Only userId is stored in localStorage.
   All data lives in Firestore via the REST API.
═════════════════════════════════════════════ */
async function apiFetch(path, { method = 'GET', body } = {}) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(`/api${path}`, opts);
  if (!res.ok) {
    const payload = await res.json().catch(() => ({}));
    throw new Error(payload.error || `HTTP ${res.status}`);
  }
  return res.json();
}

/* ═════════════════════════════════════════════
   STATE
═════════════════════════════════════════════ */
let userId   = localStorage.getItem('trakr_userId');
let username = localStorage.getItem('trakr_username');
let behaviours     = [];
let tasks          = [];
let showCompleted  = false;
let selectedPriority = null;
let activeTab      = 'dashboard';

/* ═════════════════════════════════════════════
   LOADING & TOAST
═════════════════════════════════════════════ */
const loadingOverlay = document.getElementById('loading-overlay');

function showLoading(on) {
  if (on) {
    loadingOverlay.classList.remove('hidden', 'fade-out');
  } else {
    loadingOverlay.classList.add('fade-out');
    setTimeout(() => loadingOverlay.classList.add('hidden'), 320);
  }
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

/* ═════════════════════════════════════════════
   BOOT
═════════════════════════════════════════════ */
const welcomeScreen = document.getElementById('welcome-screen');
const appEl         = document.getElementById('app');

async function loadData() {
  [behaviours, tasks] = await Promise.all([
    apiFetch(`/users/${userId}/behaviours`),
    apiFetch(`/users/${userId}/tasks`),
  ]);
}

async function bootApp() {
  try {
    await loadData();
    welcomeScreen.classList.add('hidden');
    appEl.classList.remove('hidden');
    updateGreeting();
    renderAll();
    showLoading(false);
  } catch (err) {
    console.error('Boot failed', err);
    showLoading(false);
    // If user not found in DB, clear stale localStorage and show welcome
    localStorage.removeItem('trakr_userId');
    localStorage.removeItem('trakr_username');
    userId = null;
    username = null;
    showWelcome();
  }
}

function showWelcome() {
  showLoading(false);
  welcomeScreen.classList.remove('hidden');
  appEl.classList.add('hidden');
  document.getElementById('username-input').focus();
}

// If we have a stored userId, attempt to load directly
if (userId && username) {
  bootApp();
} else {
  showWelcome();
}

/* ═════════════════════════════════════════════
   WELCOME FORM
═════════════════════════════════════════════ */
const usernameInput = document.getElementById('username-input');
const welcomeBtn    = document.getElementById('welcome-btn');
const welcomeForm   = document.getElementById('welcome-form');

usernameInput.addEventListener('input', () => {
  welcomeBtn.disabled = usernameInput.value.trim().length === 0;
});

welcomeForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = usernameInput.value.trim();
  if (!name) return;

  welcomeBtn.disabled = true;
  welcomeBtn.textContent = 'Setting up…';

  try {
    const user = await apiFetch('/users', { method: 'POST', body: { username: name } });
    userId   = user.id;
    username = user.username;
    localStorage.setItem('trakr_userId',   userId);
    localStorage.setItem('trakr_username', username);

    showLoading(true);
    await bootApp();
  } catch (err) {
    console.error(err);
    showToast('Could not connect. Please try again.');
    welcomeBtn.disabled = false;
    welcomeBtn.textContent = "Let's Begin →";
  }
});

/* ═════════════════════════════════════════════
   GREETING
═════════════════════════════════════════════ */
function updateGreeting() {
  const h = new Date().getHours();
  const period = h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
  document.getElementById('greeting').textContent = `Good ${period}, ${username} 👋`;
}

/* ═════════════════════════════════════════════
   TAB NAVIGATION
═════════════════════════════════════════════ */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => {
    const active = p.id === `tab-${tab}`;
    p.classList.toggle('active', active);
    p.classList.toggle('hidden', !active);
  });
  renderAll();
}

/* ═════════════════════════════════════════════
   RENDER: ALL
═════════════════════════════════════════════ */
function renderAll() {
  renderDashboard();
  renderBehaviours();
  renderTasks();
}

/* ═════════════════════════════════════════════
   STREAK CALCULATION
═════════════════════════════════════════════ */
function calcStreak() {
  if (!behaviours.length) return 0;
  let streak = 0;
  let cursor = todayStr();
  while (true) {
    const anyDone = behaviours.some(b => (b.completedDates || []).includes(cursor));
    if (!anyDone) break;
    streak++;
    cursor = addDays(cursor, -1);
  }
  return streak;
}

/* ═════════════════════════════════════════════
   TASK STATS
═════════════════════════════════════════════ */
function getTaskStats() {
  const today = todayStr();
  let overdue = 0, dueToday = 0, upcoming = 0;
  tasks.forEach(t => {
    if (t.completed) return;
    if      (t.dueDate < today)  overdue++;
    else if (t.dueDate === today) dueToday++;
    else                          upcoming++;
  });
  return { overdue, dueToday, upcoming };
}

/* ═════════════════════════════════════════════
   RENDER: DASHBOARD
═════════════════════════════════════════════ */
function renderDashboard() {
  // Streak
  const streak = calcStreak();
  const bannerEl = document.getElementById('streak-banner');
  if (streak >= 2) {
    document.getElementById('streak-num').textContent = streak;
    bannerEl.classList.remove('hidden');
  } else {
    bannerEl.classList.add('hidden');
  }

  // Behaviour ring
  const today = todayStr();
  const total = behaviours.length;
  const done  = behaviours.filter(b => (b.completedDates || []).includes(today)).length;
  const pct   = total > 0 ? Math.round((done / total) * 100) : 0;
  const R = 44, C = 2 * Math.PI * R;
  const offset = C - (pct / 100) * C;

  const bContent = document.getElementById('dash-behaviour-content');
  if (total === 0) {
    bContent.innerHTML = `
      <div class="empty-state">
        <p>No behaviours added yet.</p>
        <span class="empty-link" id="dash-add-behaviour">Add your first behaviour &rarr;</span>
      </div>`;
    document.getElementById('dash-add-behaviour').addEventListener('click', () => {
      switchTab('behaviours'); openBehaviourModal();
    });
  } else {
    bContent.innerHTML = `
      <div class="ring-container">
        <div class="ring-wrap">
          <svg class="ring-svg" width="100" height="100" viewBox="0 0 100 100">
            <circle class="ring-bg" cx="50" cy="50" r="${R}"/>
            <circle class="ring-progress" cx="50" cy="50" r="${R}"
              stroke-dasharray="${C.toFixed(2)}"
              stroke-dashoffset="${offset.toFixed(2)}"/>
          </svg>
          <div class="ring-text">
            <span class="ring-count">${done}/${total}</span>
            <span class="ring-pct">${pct}%</span>
          </div>
        </div>
        <div class="ring-info">
          <h3>Today's Behaviours</h3>
          <p>${done === total && total > 0 ? 'All done!' : `${total - done} left to go`}</p>
        </div>
      </div>`;
  }

  // Task counters
  const { overdue, dueToday, upcoming } = getTaskStats();
  const tContent = document.getElementById('dash-task-content');
  if (tasks.length === 0) {
    tContent.innerHTML = `
      <div class="empty-state">
        <p>No tasks yet.</p>
        <span class="empty-link" id="dash-add-task">Add one &rarr;</span>
      </div>`;
    document.getElementById('dash-add-task').addEventListener('click', () => {
      switchTab('tasks'); openTaskModal();
    });
  } else {
    tContent.innerHTML = `
      <div class="task-counters">
        <div class="counter-pill overdue" tabindex="0">
          <div class="counter-num">${overdue}</div>
          <div class="counter-label">Overdue</div>
        </div>
        <div class="counter-pill today" tabindex="0">
          <div class="counter-num">${dueToday}</div>
          <div class="counter-label">Due Today</div>
        </div>
        <div class="counter-pill upcoming" tabindex="0">
          <div class="counter-num">${upcoming}</div>
          <div class="counter-label">Upcoming</div>
        </div>
      </div>`;
    tContent.querySelectorAll('.counter-pill').forEach(pill =>
      pill.addEventListener('click', () => switchTab('tasks')));
  }
}

/* ═════════════════════════════════════════════
   RENDER: BEHAVIOURS
═════════════════════════════════════════════ */
function renderBehaviours() {
  document.getElementById('behaviour-date').textContent = fullDateStr();

  const today = todayStr();
  const listEl  = document.getElementById('behaviour-list');
  const emptyEl = document.getElementById('behaviour-empty');

  if (!behaviours.length) {
    listEl.innerHTML = '';
    listEl.classList.add('hidden');
    emptyEl.classList.remove('hidden');
    return;
  }

  listEl.classList.remove('hidden');
  emptyEl.classList.add('hidden');

  const sorted = [...behaviours].sort((a, b) => {
    const aDone = (a.completedDates || []).includes(today);
    const bDone = (b.completedDates || []).includes(today);
    if (aDone === bDone) return 0;
    return aDone ? 1 : -1;
  });

  listEl.innerHTML = sorted.map(b => {
    const isDone = (b.completedDates || []).includes(today);
    return `
      <div class="behaviour-item ${isDone ? 'completed' : ''}" data-id="${b.id}">
        <button class="b-checkbox ${isDone ? 'checked' : ''}" data-id="${b.id}" aria-label="Toggle ${escHtml(b.name)}">
          <svg viewBox="0 0 12 9"><polyline points="1,4 4.5,8 11,1"/></svg>
        </button>
        <div class="b-info">
          <div class="b-name">${escHtml(b.name)}</div>
          <div class="dots-row">${buildDots(b, today)}</div>
        </div>
        <button class="b-delete" data-id="${b.id}" aria-label="Delete ${escHtml(b.name)}">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/>
          </svg>
        </button>
      </div>`;
  }).join('');

  listEl.querySelectorAll('.b-checkbox').forEach(cb =>
    cb.addEventListener('click', () => toggleBehaviour(cb.dataset.id)));
  listEl.querySelectorAll('.b-delete').forEach(btn =>
    btn.addEventListener('click', () => deleteBehaviour(btn.dataset.id)));
}

function buildDots(behaviour, today) {
  let html = '';
  for (let i = 6; i >= 0; i--) {
    const day = addDays(today, -i);
    const isToday = day === today;
    const afterCreation = day >= behaviour.createdDate;
    if (!afterCreation) {
      html += `<span class="dot na" title="N/A"></span>`;
    } else if (isToday) {
      const done = (behaviour.completedDates || []).includes(day);
      html += `<span class="dot ${done ? 'filled' : 'today-dot'}" title="Today"></span>`;
    } else {
      const done = (behaviour.completedDates || []).includes(day);
      html += `<span class="dot ${done ? 'filled' : 'missed'}" title="${day}"></span>`;
    }
  }
  return html;
}

/* ═════════════════════════════════════════════
   RENDER: TASKS
═════════════════════════════════════════════ */
const PRIORITY_ORDER = { high: 0, medium: 1, low: 2 };
const priorityOrder = (t) => PRIORITY_ORDER[t.priority] ?? 3;

function renderTasks() {
  document.getElementById('task-date').textContent = fullDateStr();

  const completedCount = tasks.filter(t => t.completed).length;
  document.getElementById('show-completed-label').textContent =
    `${showCompleted ? 'Hide' : 'Show'} completed (${completedCount})`;
  document.getElementById('show-completed-btn').classList.toggle('active', showCompleted);

  const today     = todayStr();
  const container = document.getElementById('task-list-container');
  const emptyEl   = document.getElementById('task-empty');
  const active    = tasks.filter(t => !t.completed);

  const overdue  = active.filter(t => t.dueDate < today)
    .sort((a,b) => priorityOrder(a) - priorityOrder(b) || a.dueDate.localeCompare(b.dueDate));
  const dueToday = active.filter(t => t.dueDate === today)
    .sort((a,b) => priorityOrder(a) - priorityOrder(b));
  const upcoming = active.filter(t => t.dueDate > today)
    .sort((a,b) => priorityOrder(a) - priorityOrder(b) || a.dueDate.localeCompare(b.dueDate));
  const completed = tasks.filter(t => t.completed);

  if (!tasks.length) {
    container.innerHTML = '';
    emptyEl.classList.remove('hidden');
    return;
  }
  emptyEl.classList.add('hidden');

  let html = '';
  if (overdue.length)  html += `<div class="section-header overdue-hdr">🔴 Overdue</div><div class="task-list">${overdue.map(t => taskCard(t,'overdue')).join('')}</div>`;
  if (dueToday.length) html += `<div class="section-header today-hdr">📅 Due Today</div><div class="task-list">${dueToday.map(t => taskCard(t,'today')).join('')}</div>`;
  if (upcoming.length) html += `<div class="section-header upcoming-hdr">📆 Upcoming</div><div class="task-list">${upcoming.map(t => taskCard(t,'upcoming')).join('')}</div>`;

  if (!overdue.length && !dueToday.length && !upcoming.length && completed.length)
    html += `<div class="empty-state"><p>All tasks are done!</p></div>`;

  if (showCompleted && completed.length)
    html += `<div class="section-header done-hdr">Completed</div><div class="task-list">${completed.map(t => taskCard(t,'done')).join('')}</div>`;

  container.innerHTML = html;

  container.querySelectorAll('.t-checkbox').forEach(cb =>
    cb.addEventListener('click', () => toggleTask(cb.dataset.id)));
  container.querySelectorAll('.t-delete').forEach(btn =>
    btn.addEventListener('click', () => deleteTask(btn.dataset.id)));
}

function taskCard(task, section) {
  const isDone = section === 'done';
  return `
    <div class="task-item ${section}-item" data-id="${task.id}">
      <button class="t-checkbox ${isDone ? 'checked' : ''}" data-id="${task.id}" aria-label="Toggle task">
        <svg viewBox="0 0 12 9"><polyline points="1,4 4.5,8 11,1"/></svg>
      </button>
      <div class="task-body">
        <div class="task-name">${escHtml(task.name)}</div>
        <div class="task-meta">
          <span class="priority-pill ${task.priority}">${task.priority}</span>
          <span class="task-due">${formatDate(task.dueDate)}</span>
        </div>
      </div>
      <button class="t-delete" data-id="${task.id}" aria-label="Delete task">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/>
        </svg>
      </button>
    </div>`;
}

/* ═════════════════════════════════════════════
   BEHAVIOUR CRUD  (optimistic updates for toggles)
═════════════════════════════════════════════ */
async function toggleBehaviour(id) {
  const today = todayStr();
  const b = behaviours.find(x => x.id === id);
  if (!b) return;

  const prev = b.completedDates || [];
  const next = prev.includes(today) ? prev.filter(d => d !== today) : [...prev, today];

  // Optimistic update
  behaviours = behaviours.map(x => x.id === id ? { ...x, completedDates: next } : x);
  animateCheckbox(`.b-checkbox[data-id="${id}"]`);
  renderAll();

  try {
    await apiFetch(`/users/${userId}/behaviours/${id}`, { method: 'PATCH', body: { completedDates: next } });
  } catch (err) {
    // Revert
    behaviours = behaviours.map(x => x.id === id ? { ...x, completedDates: prev } : x);
    renderAll();
    showToast('Failed to save. Please try again.');
  }
}

async function deleteBehaviour(id) {
  const backup = behaviours.find(b => b.id === id);
  behaviours = behaviours.filter(b => b.id !== id);
  renderAll();

  try {
    await apiFetch(`/users/${userId}/behaviours/${id}`, { method: 'DELETE' });
  } catch (err) {
    if (backup) behaviours.push(backup);
    renderAll();
    showToast('Failed to delete. Please try again.');
  }
}

async function addBehaviour(name) {
  try {
    const b = await apiFetch(`/users/${userId}/behaviours`, {
      method: 'POST',
      body: { name, createdDate: todayStr() },
    });
    behaviours.push(b);
    renderAll();
  } catch (err) {
    showToast('Failed to add behaviour. Please try again.');
  }
}

/* ═════════════════════════════════════════════
   TASK CRUD  (optimistic for toggle)
═════════════════════════════════════════════ */
async function toggleTask(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;

  const prevCompleted = t.completed;
  const nextCompleted = !prevCompleted;

  tasks = tasks.map(x => x.id === id ? { ...x, completed: nextCompleted } : x);
  animateCheckbox(`.t-checkbox[data-id="${id}"]`);
  renderAll();

  try {
    await apiFetch(`/users/${userId}/tasks/${id}`, { method: 'PATCH', body: { completed: nextCompleted } });
  } catch (err) {
    tasks = tasks.map(x => x.id === id ? { ...x, completed: prevCompleted } : x);
    renderAll();
    showToast('Failed to save. Please try again.');
  }
}

async function deleteTask(id) {
  const backup = tasks.find(t => t.id === id);
  tasks = tasks.filter(t => t.id !== id);
  renderAll();

  try {
    await apiFetch(`/users/${userId}/tasks/${id}`, { method: 'DELETE' });
  } catch (err) {
    if (backup) tasks.push(backup);
    renderAll();
    showToast('Failed to delete. Please try again.');
  }
}

async function addTask(name, priority, dueDate) {
  try {
    const t = await apiFetch(`/users/${userId}/tasks`, {
      method: 'POST',
      body: { name, priority, dueDate },
    });
    tasks.push(t);
    renderAll();
  } catch (err) {
    showToast('Failed to add task. Please try again.');
  }
}

/* ═════════════════════════════════════════════
   CHECKBOX ANIMATION HELPER
═════════════════════════════════════════════ */
function animateCheckbox(selector) {
  const el = document.querySelector(selector);
  if (!el) return;
  el.classList.add('pop');
  el.addEventListener('animationend', () => el.classList.remove('pop'), { once: true });
}

/* ═════════════════════════════════════════════
   MODALS
═════════════════════════════════════════════ */
function openModal(id) {
  const el = document.getElementById(id);
  el.classList.add('open');
  setTimeout(() => { const inp = el.querySelector('input'); if (inp) inp.focus(); }, 100);
  el.addEventListener('click', e => { if (e.target === el) closeModal(id); }, { once: true });
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

// Behaviour modal
const bNameInput = document.getElementById('b-name-input');

function openBehaviourModal() {
  bNameInput.value = '';
  openModal('behaviour-modal');
}

document.getElementById('fab-behaviour').addEventListener('click', openBehaviourModal);
document.getElementById('add-behaviour-empty-link').addEventListener('click', openBehaviourModal);

document.getElementById('behaviour-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = bNameInput.value.trim();
  if (!name) return;
  closeModal('behaviour-modal');
  await addBehaviour(name);
});

// Task modal
const tNameInput = document.getElementById('t-name-input');
const tDueInput  = document.getElementById('t-due-input');
const prioSel    = document.getElementById('priority-selector');

function openTaskModal() {
  tNameInput.value    = '';
  tDueInput.value     = todayStr();
  selectedPriority    = null;
  prioSel.querySelectorAll('.priority-option').forEach(o => { o.className = 'priority-option'; });
  openModal('task-modal');
}

document.getElementById('fab-task').addEventListener('click', openTaskModal);
document.getElementById('add-task-empty-link').addEventListener('click', openTaskModal);

prioSel.querySelectorAll('.priority-option').forEach(opt => {
  opt.addEventListener('click', () => {
    selectedPriority = opt.dataset.value;
    prioSel.querySelectorAll('.priority-option').forEach(o => { o.className = 'priority-option'; });
    opt.classList.add(`selected-${selectedPriority}`);
  });
});

document.getElementById('task-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = tNameInput.value.trim();
  const due  = tDueInput.value;
  if (!name || !selectedPriority || !due) return;
  closeModal('task-modal');
  await addTask(name, selectedPriority, due);
});

// Show/hide completed toggle
document.getElementById('show-completed-btn').addEventListener('click', () => {
  showCompleted = !showCompleted;
  renderTasks();
});
</script>
